<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar acesso — Born From Seed</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#164b34;--y:#f5c728;--ink:#171815;--paper:#f7f7f2;--line:#e1e3da;--muted:#6d716a}*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial;background:var(--paper);color:var(--ink)}main{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(450px,100%);background:#fff;padding:42px}.brand{font:800 20px/.85 Manrope;letter-spacing:-1px;text-transform:uppercase;color:var(--g)}.brand span{display:block;color:var(--y)}h1{font-size:42px;line-height:.9;letter-spacing:-.07em;text-transform:uppercase;margin:28px 0 14px}.muted{font-size:13px;line-height:1.6;color:var(--muted)}.field{display:grid;gap:6px;margin:16px 0}.field label{font:500 10px 'DM Mono';letter-spacing:.06em;text-transform:uppercase}.field input{padding:11px;border:1px solid var(--line);outline-color:var(--g)}button{border:0;background:var(--g);color:#fff;width:100%;padding:14px 16px;font:700 10px 'DM Mono';letter-spacing:.06em;text-transform:uppercase;cursor:pointer}button:hover{background:#0d3826}button:disabled{opacity:.6;cursor:wait}.status{min-height:20px;font-size:12px;line-height:1.5;color:var(--muted);margin:14px 0 0}.status.error{color:#9d2e1f}.success{display:none;background:#e9f0e6;color:var(--g);padding:14px;font-size:13px;line-height:1.55;margin-top:18px}</style></head><body><main><section class="card"><div class="brand">Born From<span>Seed</span></div><h1>Configurar<br>acesso.</h1><p class="muted">Esta tela é usada uma única vez para ativar o login por senha do administrador. Nenhum e-mail será enviado.</p><form id="setup"><div class="field"><label>E-mail administrador</label><input name="email" type="email" value="guiessencial2@gmail.com" required autocomplete="email"></div><div class="field"><label>Senha do painel</label><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><div class="field"><label>Confirmar senha</label><input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Segredo de configuração</label><input name="setupSecret" type="password" required autocomplete="off"></div><button>Ativar login por senha →</button><p class="status" id="status"></p></form><div class="success" id="success">Senha ativada. Agora apague a variável <strong>ADMIN_SETUP_SECRET</strong> no Netlify e entre pelo <a href="/admin.html">painel administrativo</a>.</div></section></main><script>const form=document.querySelector('#setup'),status=document.querySelector('#status'),success=document.querySelector('#success');form.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.password!==data.confirmPassword){status.textContent='As senhas não conferem.';status.classList.add('error');return}const button=form.querySelector('button');button.disabled=true;status.classList.remove('error');status.textContent='Ativando acesso…';try{const response=await fetch('/.netlify/functions/setup-admin-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Não foi possível concluir.');form.style.display='none';success.style.display='block'}catch(error){status.textContent=error.message;status.classList.add('error');button.disabled=false}};</script></body></html>
